[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baibao"
version = "0.0.8"
description = "百宝，方便好用的 Python 常用功能库。把日常开发中反复用到的能力封装成简洁的 API，开箱即用。"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "Kahle"}
]
dependencies = [
    "pykunlun>=0.0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
all = ["easyocr>=1.7.0", "paddleocr>=2.7.0", "opencv-python>=4.8.0", "numpy>=1.24.0", "bottle>=0.12"]
dev = ["pytest", "ruff", "mypy"]
easyocr = ["easyocr>=1.7.0", "opencv-python>=4.8.0", "numpy>=1.24.0"]
paddleocr = ["paddleocr>=2.7.0", "opencv-python>=4.8.0", "numpy>=1.24.0"]
autotest = ["playwright>=1.40", "python-dotenv>=1.0", "faker"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["easyocr", "paddleocr", "bottle", "playwright", "playwright.sync_api", "dotenv", "faker"]
ignore_missing_imports = true

# bottle 无类型标注，其路由装饰器（@app.get/@app.post/@app.error）会把
# 被装饰的处理函数整体降级为 untyped（untyped-decorator），属第三方库噪声
[[tool.mypy.overrides]]
module = "baibao.ai.ocr.server"
disable_error_code = ["untyped-decorator"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "S110",    # try-except-pass：资源清理场景，静默是预期行为
    "BLE001",  # 盲异常：与 S110 重叠的工具库资源清理场景
    "DTZ005",  # datetime.now() 无 tz：工具库默认使用 naive datetime
    "DTZ007",  # strptime 无 %z：同上
    "DTZ011",  # date.today() 无 tz：同上（naive date）
    # PIE790：不必要的 pass 语句
    # 抽象方法、空实现方法、异常子类等场景显式保留 pass，更直观表达
    # "此处为空占位/待子类实现" 的意图，与 docstring 配合可读性更好。
    "PIE790",
    "S112",    # try-except-continue：与 S110 重叠的工具库资源清理/候选回退场景
]

[tool.pytest.ini_options]
pythonpath = ["src"]
